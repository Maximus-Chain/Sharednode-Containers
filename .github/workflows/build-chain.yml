name: Build and Push Chain Image

on:
  workflow_call:
    inputs:
      chain-name:
        description: 'Chain slug (used for cache key and binary lookup)'
        required: true
        type: string
      context-path:
        description: 'Path (relative to repo root) used as Docker build context'
        required: true
        type: string
      image-name:
        description: 'Full image name without registry, e.g. maximus-chain/osmiumd'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        env:
          CHAIN: ${{ inputs.chain-name }}
          IMAGE: ${{ env.REGISTRY }}/${{ inputs.image-name }}
        run: |
          SHORT="${GITHUB_SHA::7}"
          TAGLIST="${IMAGE}:sha-${SHORT}"
          case "${GITHUB_REF}" in
            refs/heads/main|refs/heads/master)
              TAGLIST="${TAGLIST},${IMAGE}:latest"
              ;;
            refs/heads/develop)
              TAGLIST="${TAGLIST},${IMAGE}:develop"
              ;;
            refs/tags/*)
              TAG_NAME="${GITHUB_REF_NAME#${CHAIN}-}"
              TAGLIST="${TAGLIST},${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:${TAG_NAME},${IMAGE}:latest"
              ;;
          esac
          echo "tags=${TAGLIST}" >> "$GITHUB_OUTPUT"

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache-${{ inputs.chain-name }}
          key: ${{ runner.os }}-buildx-${{ inputs.chain-name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ inputs.chain-name }}-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context-path }}
          file: ${{ inputs.context-path }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=local,src=/tmp/.buildx-cache-${{ inputs.chain-name }}
          cache-to: type=local,dest=/tmp/.buildx-cache-${{ inputs.chain-name }}-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache-${{ inputs.chain-name }}
          mv /tmp/.buildx-cache-${{ inputs.chain-name }}-new /tmp/.buildx-cache-${{ inputs.chain-name }} 2>/dev/null || true

      - name: Verify image
        run: |
          SHORT="${GITHUB_SHA::7}"
          docker run --rm --entrypoint "/usr/local/bin/${{ inputs.chain-name }}d" \
            "${{ env.REGISTRY }}/${{ inputs.image-name }}:sha-${SHORT}" --version
